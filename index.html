<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAXI 80320</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    background: #080b10;
    color: white;
}

.app {
    min-height: 100vh;
    max-width: 560px;
    margin: auto;
    padding: 50px 20px;
}

.header {
    margin-top: 30px;
}

.eyebrow {
    color: #8290a5;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    font-size: 36px;
    margin: 8px 0;
    letter-spacing: 1px;
}

.subtitle {
    color: #8995a6;
    font-size: 14px;
}

.search {
    margin-top: 35px;
}

.search input {
    width: 100%;
    padding: 18px;
    border-radius: 17px;
    border: 1px solid #27313e;
    background: #111720;
    color: white;
    font-size: 16px;
    outline: none;
}

.search input:focus {
    border-color: #536fff;
}

.card {
    margin-top: 20px;
    padding: 22px;
    border-radius: 20px;
    border: 1px solid #202a36;
    background: linear-gradient(145deg, #131a23, #0d1218);
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.card h2 {
    margin-top: 0;
    font-size: 18px;
}

.card p {
    color: #9aa6b5;
    line-height: 1.5;
    font-size: 14px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: 1px solid #293442;
    background: #151d27;
    color: white;
    padding: 14px;
    border-radius: 13px;
    font-size: 14px;
    font-weight: 600;
}

button.primary {
    background: #293d88;
    border-color: #4660d0;
}

.footer {
    text-align: center;
    margin-top: 40px;
    color: #566171;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="eyebrow">
            INDEX CHAUFFEURS · 80320
        </div>

        <h1>🚕 TAXI 80320</h1>

        <div class="subtitle">
            Chaulnes · accès rapide aux clients
        </div>

    </div>

    <div class="search">

        <input
            type="search"
            placeholder="Rechercher un client..."
        >

    </div>

    <div class="card">

        <h2>Bienvenue</h2>

        <p>
            Retrouvez rapidement les informations
            nécessaires pour vos courses.
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="document.querySelector('input').focus()">
                🔎 Rechercher
            </button>

            <button>
                📞 Appeler
            </button>

        </div>

    </div>

    <div class="footer">
        Développé par Leo Dautrevaux · 2026
    </div>

</div>

</body>
</html>
